<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estimates — Deenas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: #0f172a;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 24px;
    }

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .top-section h2 {
      margin: 0 0 5px;
    }

    .top-section p {
      margin: 0;
      color: #64748b;
    }

    .new-button,
    .save-button,
    .add-item-button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .new-button {
      background: #2563eb;
    }

    .save-button {
      width: 100%;
      margin-top: 18px;
      background: #16a34a;
    }

    .add-item-button {
      margin-top: 12px;
      background: #475569;
    }

    .form-card,
    .estimate-card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
      margin-bottom: 18px;
    }

    .form-card {
      display: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      grid-column: 1 / -1;
    }

    .item-row {
      display: grid;
      grid-template-columns: 2fr 0.7fr 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .remove-button,
    .delete-button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fee2e2;
      color: #b91c1c;
      cursor: pointer;
      font-weight: bold;
    }

    .totals {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .totals p {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .grand-total {
      font-size: 20px;
      font-weight: bold;
    }

    .estimate-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .estimate-card h3 {
      margin: 0 0 8px;
    }

    .estimate-card p {
      margin: 4px 0;
      color: #64748b;
    }

    .empty-message {
      text-align: center;
      padding: 35px;
      color: #64748b;
      background: white;
      border-radius: 14px;
    }

    @media (max-width: 700px) {
      .top-section,
      .estimate-card {
        flex-direction: column;
        align-items: stretch;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      textarea {
        grid-column: auto;
      }

      .item-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Deenas</h1>
  <a href="dashboard.html">← Dashboard</a>
</header>

<main class="container">

  <section class="top-section">
    <div>
      <h2>Estimates</h2>
      <p>Create and save professional estimates.</p>
    </div>

    <button class="new-button" id="showEstimateForm">
      + New Estimate
    </button>
  </section>

  <section class="form-card" id="estimateFormCard">
    <h3>Create Estimate</h3>

    <form id="estimateForm">

      <div class="form-grid">
        <input
          id="customerName"
          type="text"
          placeholder="Customer name"
          required
        >

        <input
          id="estimateNumber"
          type="text"
          readonly
        >

        <input
          id="estimateDate"
          type="date"
          required
        >

        <input
          id="expirationDate"
          type="date"
        >

        <textarea
          id="estimateNotes"
          placeholder="Estimate notes"
        ></textarea>
      </div>

      <h3>Services or Products</h3>

      <div id="itemsContainer"></div>

      <button
        class="add-item-button"
        type="button"
        id="addItemButton"
      >
        + Add Item
      </button>

      <div class="totals">
        <p>
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </p>

        <p>
          <span>Tax</span>
          <span id="tax">$0.00</span>
        </p>

        <p class="grand-total">
          <span>Total</span>
          <span id="grandTotal">$0.00</span>
        </p>
      </div>

      <button class="save-button" type="submit">
        Save Estimate
      </button>

    </form>
  </section>

  <section id="estimateList"></section>

</main>

<script>
  const estimateFormCard = document.getElementById("estimateFormCard");
  const estimateForm = document.getElementById("estimateForm");
  const estimateList = document.getElementById("estimateList");
  const showEstimateForm = document.getElementById("showEstimateForm");
  const addItemButton = document.getElementById("addItemButton");
  const itemsContainer = document.getElementById("itemsContainer");

  let estimates = JSON.parse(
    localStorage.getItem("deenasEstimates")
  ) || [];

  showEstimateForm.addEventListener("click", function () {
    const isHidden = estimateFormCard.style.display !== "block";

    estimateFormCard.style.display = isHidden ? "block" : "none";
    showEstimateForm.textContent = isHidden
      ? "Cancel"
      : "+ New Estimate";

    if (isHidden && itemsContainer.children.length === 0) {
      addItemRow();
    }
  });

  addItemButton.addEventListener("click", addItemRow);

  function addItemRow() {
    const row = document.createElement("div");
    row.className = "item-row";

    row.innerHTML = `
      <input
        class="item-description"
        type="text"
        placeholder="Service or product"
        required
      >

      <input
        class="item-quantity"
        type="number"
        min="1"
        value="1"
        required
      >

      <input
        class="item-price"
        type="number"
        min="0"
        step="0.01"
        placeholder="Price"
        required
      >

      <button
        class="remove-button"
        type="button"
      >
        Remove
      </button>
    `;

    row.querySelector(".remove-button")
      .addEventListener("click", function () {
        row.remove();
        calculateTotals();
      });

    row.querySelectorAll("input").forEach(input => {
      input.addEventListener("input", calculateTotals);
    });

    itemsContainer.appendChild(row);
  }

  function calculateTotals() {
    let subtotal = 0;

    document.querySelectorAll(".item-row").forEach(row => {
      const quantity = Number(
        row.querySelector(".item-quantity").value
      ) || 0;

      const price = Number(
        row.querySelector(".item-price").value
      ) || 0;

      subtotal += quantity * price;
    });

    const tax = subtotal * 0.08;
    const total = subtotal + tax;

    document.getElementById("subtotal").textContent =
      formatMoney(subtotal);

    document.getElementById("tax").textContent =
      formatMoney(tax);

    document.getElementById("grandTotal").textContent =
      formatMoney(total);
  }

  estimateForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const items = [];

    document.querySelectorAll(".item-row").forEach(row => {
      items.push({
        description: row.querySelector(".item-description").value.trim(),
        quantity: Number(row.querySelector(".item-quantity").value),
        price: Number(row.querySelector(".item-price").value)
      });
    });

    let subtotal = 0;

    items.forEach(item => {
      subtotal += item.quantity * item.price;
    });

    const tax = subtotal * 0.08;
    const total = subtotal + tax;

    const estimate = {
      id: Date.now(),
      customerName: document.getElementById("customerName").value.trim(),
      estimateNumber: document.getElementById("estimateNumber").value,
      date: document.getElementById("estimateDate").value,
      expirationDate: document.getElementById("expirationDate").value,
      notes: document.getElementById("estimateNotes").value.trim(),
      items,
      subtotal,
      tax,
      total
    };

    estimates.unshift(estimate);

    localStorage.setItem(
      "deenasEstimates",
      JSON.stringify(estimates)
    );

    estimateForm.reset();
    itemsContainer.innerHTML = "";
    estimateFormCard.style.display = "none";
    showEstimateForm.textContent = "+ New Estimate";

    prepareNewEstimate();
    displayEstimates();
    calculateTotals();
  });

  function deleteEstimate(id) {
    const confirmed = confirm(
      "Are you sure you want to delete this estimate?"
    );

    if (!confirmed) {
      return;
    }

    estimates = estimates.filter(
      estimate => estimate.id !== id
    );

    localStorage.setItem(
      "deenasEstimates",
      JSON.stringify(estimates)
    );

    displayEstimates();
  }

  function displayEstimates() {
    if (estimates.length === 0) {
      estimateList.innerHTML = `
        <div class="empty-message">
          No estimates yet. Tap “New Estimate” to create your first one.
        </div>
      `;
      return;
    }

    estimateList.innerHTML = estimates.map(estimate => `
      <article class="estimate-card">
        <div>
          <h3>${escapeHtml(estimate.estimateNumber)}</h3>
          <p>Customer: ${escapeHtml(estimate.customerName)}</p>
          <p>Date: ${escapeHtml(estimate.date)}</p>
          <p>Total: ${formatMoney(estimate.total)}</p>
        </div>

        <button
          class="delete-button"
          onclick="deleteEstimate(${estimate.id})"
        >
          Delete
        </button>
      </article>
    `).join("");
  }

  function prepareNewEstimate() {
    const nextNumber = estimates.length + 1001;

    document.getElementById("estimateNumber").value =
      "EST-" + nextNumber;

    document.getElementById("estimateDate").value =
      new Date().toISOString().split("T")[0];
  }

  function formatMoney(value) {
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    }).format(value);
  }

  function escapeHtml(value) {
    const element = document.createElement("div");
    element.textContent = value;
    return element.innerHTML;
  }

  prepareNewEstimate();
  displayEstimates();
</script>

</body>
</html>
