<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Deenas.app</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07111f,#0f2d5f,#2563eb);
}

.card{
  width:100%;
  max-width:380px;
  padding:34px;
  box-sizing:border-box;
  background:white;
  border-radius:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  color:#2563eb;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:12px;
}

h1{
  margin:0 0 8px;
  text-align:center;
  color:#111827;
}

.subtitle{
  margin:0 0 24px;
  text-align:center;
  color:#6b7280;
}

label{
  display:block;
  margin:14px 0 6px;
  color:#374151;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.links{
  margin-top:20px;
  text-align:center;
  color:#6b7280;
}

a{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">DEENAS.APP</div>

  <h1>Welcome Back</h1>
  <p class="subtitle">Log in to continue your career journey.</p>

  <form>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" required>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password" required>

    <button type="submit">Log In</button>
  </form>

  <div class="links">
    New to Deenas?
    <a href="signup.html">Create an account</a>
    <br><br>
    <a href="index.html">Back to Home</a>
  </div>
</div>

</body>
</html>
