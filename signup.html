<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Deenas.app</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07111f,#0f2d5f,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.card{
    background:white;
    color:#222;
    width:350px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

p{
    text-align:center;
}

a{
    color:#2563eb;
}
</style>
</head>

<body>

<div class="card">
<h2>Create Account</h2>

<form id="signupForm">
<input id="fullName" type="text" placeholder="Full Name" required>
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" minlength="6" required>

<button type="submit">Create Account</button>
</form>

<p>
Already have an account?
<a href="index.html">Home</a>
</p>

</div>

</body>
</html>
